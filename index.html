<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>three.js demo</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
    #info {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      font: 13px/1.4 system-ui, sans-serif; color: #9aa4b2; letter-spacing: .04em;
      user-select: none; pointer-events: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">three.js &mdash; drag to orbit</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;

    // A glowing icosahedron
    const geometry = new THREE.IcosahedronGeometry(1.2, 0);
    const material = new THREE.MeshStandardMaterial({
      color: 0x4f9dff, metalness: 0.3, roughness: 0.25, flatShading: true,
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const wire = new THREE.LineSegments(
      new THREE.WireframeGeometry(geometry),
      new THREE.LineBasicMaterial({ color: 0x8fd0ff, transparent: true, opacity: 0.25 })
    );
    mesh.add(wire);

    scene.add(new THREE.AmbientLight(0x404a5c, 1.5));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(5, 5, 5);
    scene.add(key);
    const rim = new THREE.PointLight(0xff5fae, 1.5, 20);
    rim.position.set(-4, -2, -3);
    scene.add(rim);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop((t) => {
      mesh.rotation.x = t * 0.0002;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
